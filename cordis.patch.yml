# ============================================================================
# dsh-client-ui-wallpaper —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件的 patch，本文件把壁纸插件插入 profile 配置树。
#
# 安装（把本目录作为 bundle 加进 profile）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或本地开发/手动：
#   node scripts/install.mjs --profile desktop
# ============================================================================

- insert:
    - id: ui-wallpaper
      name: ./plugins/dsh-client-ui-wallpaper/lib/index.js
